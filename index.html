    <style>
        :root {
            --app-bg: #0f172a;
            --gauge-idle: rgba(255, 255, 255, 0.08);
            --gauge-active: #f97316;
        }
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background-color: var(--app-bg);
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
            width: 100%;
            height: 100vh;
        }

        /* Gauge Container */
        .gauge-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            pointer-events: none;
            z-index: 0;
        }
        @media (max-width: 640px) {
            .gauge-container {
                width: 320px;
                height: 320px;
            }
        }

        /* Static Circle of Ticks */
        .gauge-static {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .tick {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 12px;
            background: var(--gauge-idle);
            border-radius: 4px;
        }

        /* Rotating Highlight Segment */
        .gauge-rotating {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: rotate-gauge 6s infinite linear;
        }

        .active-tick {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 3px;
            height: 14px;
            background: var(--gauge-active);
            box-shadow: 0 0 12px var(--gauge-active);
            border-radius: 4px;
        }

        @keyframes rotate-gauge {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Layout Grid and other UI elements */
        .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            width: 100%;
        }
        @media(min-width: 640px) {
            .folder-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .login-card {
            background: rgba(30, 41, 59, 0.95);
            backdrop-blur: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
    </style>
